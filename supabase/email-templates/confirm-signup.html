<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#eeeeee; -webkit-text-size-adjust:100%;">

<!-- 받은편지함 미리보기 문구 (본문에는 보이지 않음) -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
  이메일 인증만 마치면 대시보드를 바로 사용할 수 있습니다.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eeeeee;">
<tr>
<td align="center" style="padding:40px 16px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;">

    <!-- 로고 -->
    <tr>
      <td align="center" style="padding-bottom:24px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:26px; font-weight:900; letter-spacing:1px; color:#2b2b2b;">
        PLANSCHOOL
      </td>
    </tr>

    <!-- 본문 카드 -->
    <tr>
      <td style="background-color:#ffffff; border-radius:16px; padding:44px 40px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">

        <p style="margin:0 0 12px; font-size:22px; font-weight:700; color:#2b2b2b; line-height:1.4;">
          가입을 환영합니다
        </p>

        <p style="margin:0 0 28px; font-size:15px; color:#5f5f5f; line-height:1.75;">
          아래 버튼을 눌러 이메일 인증을 완료해 주세요.<br>
          인증이 끝나면 바로 로그인하실 수 있습니다.
        </p>

        <!-- 버튼 -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;">
          <tr>
            <td align="center" bgcolor="#4A4A4A" style="border-radius:10px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block; padding:15px 42px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px;">
                이메일 인증하기
              </a>
            </td>
          </tr>
        </table>

        <!-- 구분선 -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="border-top:1px solid #ededed; font-size:0; line-height:0;">&nbsp;</td></tr>
        </table>

        <p style="margin:24px 0 8px; font-size:13px; color:#979797; line-height:1.7;">
          버튼이 눌리지 않으면 아래 주소를 복사해 브라우저에 붙여넣어 주세요.
        </p>
        <p style="margin:0; font-size:12px; line-height:1.6; word-break:break-all;">
          <a href="{{ .ConfirmationURL }}" style="color:#4A4A4A; text-decoration:underline;">{{ .ConfirmationURL }}</a>
        </p>

      </td>
    </tr>

    <!-- 푸터 -->
    <tr>
      <td align="center" style="padding:24px 16px 0; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:12px; color:#979797; line-height:1.8;">
        이 메일은 <span style="color:#5f5f5f;">{{ .Email }}</span> 주소로 가입을 신청해서 발송되었습니다.<br>
        본인이 신청한 것이 아니라면 이 메일을 무시하셔도 됩니다.
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
